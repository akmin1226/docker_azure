name: Multi Registry Deploy

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login DockerHub
        run: |
          docker login \
          -u ${{ secrets.DOCKERHUB_USERNAME }} \
          -p ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login ACR
        run: |
          docker login ${{ secrets.ACR_LOGIN_SERVER }} \
          -u ${{ secrets.ACR_USERNAME }} \
          -p ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t flask-app:latest .

      - name: Tag DockerHub Image
        run: |
          docker tag flask-app:latest \
          ${{ secrets.DOCKERHUB_USERNAME }}/flask-acr-lab:latest

      - name: Tag ACR Image
        run: |
          docker tag flask-app:latest \
          ${{ secrets.ACR_LOGIN_SERVER }}/flask-acr-lab:latest

      - name: Push DockerHub
        run: |
          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/flask-acr-lab:latest

      - name: Push ACR
        run: |
          docker push \
          ${{ secrets.ACR_LOGIN_SERVER }}/flask-acr-lab:latest